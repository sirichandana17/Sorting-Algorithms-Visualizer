<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sorting Algorithms Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Sorting Algorithms Visualizer</h1>

<!-- MESSAGE -->
<div id="message" class="message"></div>

<!-- ARRAY INPUT -->
<div class="controls top-controls">
    <button onclick="generateArray()">Generate Random</button>
    <input id="customArray" placeholder="Enter array e.g. 22,41,6,71,11,46">
    <button onclick="useCustomArray()">Use Array</button>
</div>

<!-- SORT BUTTONS -->
<div class="controls">
    <button onclick="bubbleSort()">Bubble Sort</button>
    <button onclick="selectionSort()">Selection Sort</button>
    <button onclick="insertionSort()">Insertion Sort</button>
    <button onclick="mergeSortStart()">Merge Sort</button>
    <button onclick="quickSortStart()">Quick Sort</button>
</div>

<div id="array" class="array-container"></div>

<!-- CONFETTI -->
<div id="confetti-container"></div>

<script src="script.js"></script>
</body>
</html>
